name: Data Pipeline

on:
  push:
    paths:
      - "data/*.dvc"
      - "models/*.dvc"

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the Repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: pip

      # Step 3: Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Authenticate with GCS
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project mlops-448114
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # Step 4: Pull DVC Dependencies
      - name: Pull DVC data
        run: |
          pip install dvc[gdrive]
          pip install dvc[gs]
          dvc pull

      # Step 5: Train the Model
      - name: Train the model
        run: |
          python src/twitter_classification/train.py

      # Step 6: Evaluate the Model
      - name: Evaluate the model
        run: |
          python src/twitter_classification/evaluate.py

      # Optional Step 7: Update API (Restart or Reload)
      - name: Restart API
        run: |
          systemctl restart my-fastapi-api.service || echo "API restart skipped in CI"
